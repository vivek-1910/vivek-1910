<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Vivek Gowda S — Ideas into apps.</title>
  <desc id="desc">AI product builder and full-stack mobile developer. A charcoal banner with lime typography and an abstract orbital illustration.</desc>
